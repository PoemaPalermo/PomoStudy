<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>The web site of pomostudy</title>
        <link rel="stylesheet" href="./style.css" type="text/css" media="all">
    </head>
    <body>
        
        <div class="task">   
            <div class="container">
                <h2> To-do list: </h2>

                <input type="text" id="task-input" placeholder="tarea...">
                <button id="add-task">Agregar</button>
                <ul id="task-list"></ul>
            </div>

        </div>
        <div class="timer">
            <div class="container">
                <h2> Cronometro </h2>

                <hr>

                <p class="time" id="time"> 25:00 </p>

                <div class="button-wraper">
                    <button id="start">Start</button>
                    <button id="stop">Stop</button>
                    <button id="reset">Reset</button>
                </div>
            </div>
        </div>
        
        <script src="app.js"></script>
    </body>
</html>
